name: Apply hardening snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply uploaded hardening snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .hardening/dsh-hardening-changes.tar.gz
          rm -f .hardening/dsh-hardening-changes.tar.gz
          rmdir .hardening 2>/dev/null || true
      - name: Commit source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Harden DSH plugin integration and add real smoke tests'
          git push origin HEAD:main
